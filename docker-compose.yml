# version: '3.8'

services:
  bot:
    build: .
    container_name: youtube_downloader_bot
    depends_on:
      - db
      - redis
      - telegram-bot-api
    env_file:
      - .env
    volumes:
      - ./www.youtube.com_cookies.txt:/app/www.youtube.com_cookies.txt
      - ${SSH_KEY_HOST_PATH}:/app/id_ed25519:ro
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram_bot_api
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Поменять
      POSTGRES_DB: ${POSTGRES_DB:-youtube_bot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis_cache

volumes:
  postgres_data:
  telegram-bot-api-data:
